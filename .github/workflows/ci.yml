name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: treasury-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      # @adasouls/sdk isn't published yet -- treasury-agent/package.json
      # depends on it via "file:../../adasouls-sdk-typescript" (a
      # sibling-checkout path, matching local dev's directory layout; see
      # treasury-agent/README.md's "Known gaps"). That resolves to one
      # level *above* $GITHUB_WORKSPACE, so this checks the SDK repo out
      # there too, at the exact relative location the file: path expects.
      - name: Checkout adasouls-sdk-typescript
        uses: actions/checkout@v4
        with:
          repository: AdaSouls/adasouls-sdk-typescript
          path: ../adasouls-sdk-typescript
      - name: Build the SDK dependency
        working-directory: ../adasouls-sdk-typescript
        run: npm ci && npm run build
      - run: npm install
      - run: npm run lint
      - run: npm run build
      # Only the mocked/skipped-by-default suite runs here -- see
      # test/treasury-agent.test.ts's skipIf and README.md's "Known gaps"
      # (no deployed dev environment yet to run the real integration path
      # against).
      - run: npm test
