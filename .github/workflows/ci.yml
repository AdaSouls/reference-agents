name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: treasury-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: treasury-agent/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      # Only the mocked/skipped-by-default suite runs here -- see
      # test/treasury-agent.test.ts's skipIf and README.md's "Known gaps"
      # (no deployed dev environment yet to run the real integration path
      # against).
      - run: npm test
